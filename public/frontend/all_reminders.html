<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Dailies - All Reminders</title>

    <!-- Adding Bootstrap -->
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <!-- Adding custom CSS -->
    <link rel="stylesheet" href="../assets/css/all_reminders.css">
</head>
<body>
    
    <!-- this page will be where the user can view all reminders that have been made -->

    <!-- the page will be split up like a T  -->

    <!-- the top half is mostly blank space but will have options to create a new
    reminder or manage current reminders -->

    <!-- the bottom left half will display the current, active reminders (in order of
    how soon theyre comming up) -->

    <!-- the bottom right half will display the inactive reminders (ones that are not
    deleted, just not currently in use) -->

    <div class="d-flex vh-100">

        <!-- Sidebar (same as dashboard) -->
        <aside class="sidebar d-flex flex-column p-3">
            <div class="d-flex align-items-center gap-2 pb-3 sidebar-divider">
                <i class="bi bi-person-circle fs-1"></i>
                <span id="profileName" class="small">Dashboard</span>
            </div>

            <nav class="d-grid gap-3 mt-4">
                <a href="all_lists.html" class="btn btn-light border border-dark rounded-pill fw-bold btn-sm">All Lists</a>
                <a href="all_reminders.html" class="btn btn-light border border-dark rounded-pill fw-bold btn-sm" aria-current="page">All Reminders</a>
            </nav>

            <div class="mt-auto d-flex flex-column align-items-center gap-2">
                <a href="settings.html" class="btn btn-secondary btn-sm fw-bold">
                    <i class="bi bi-gear-fill"></i> Settings
                </a>
                <a href="profile_select.html" class="btn btn-danger btn-sm">Switch profile</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-grow-1 d-flex flex-column overflow-hidden">
            <div class="flex-grow-1 overflow-auto px-4 pt-3 pb-4">

            <h1 class="display-4 mb-0">Your Reminders</h1>
            <a href="dashboard.html" class="text-dark text-decoration-none d-inline-flex align-items-center gap-2">
                <i class="bi bi-arrow-left-circle fs-5"></i> Dashboard
            </a>

            <!-- Toolbar (normal + manage mode) -->
            <div class="pb-2 mt-2 page-divider">
                <div id="normalActions" class="d-flex justify-content-end gap-2">
                <a href="reminder.html" class="btn btn-info btn-sm fw-bold rounded-pill px-3">+ Add New</a>
                <button id="manageRemindersBtn" type="button" class="btn btn-light border border-dark btn-sm fw-bold rounded-pill">
                    <i class="bi bi-gear-fill"></i> Manage Reminders
                </button>
                </div>

                <div id="manageActions" class="d-none d-flex justify-content-end">
                <button id="doneBtn" type="button" class="btn btn-outline-info btn-sm fw-bold rounded-pill px-3">Done</button>
                </div>
            </div>

            <!-- Active / Inactive columns -->
            <div id="remindersArea" class="row mt-3">
                <div class="col-md-6 pe-md-4">
                <h2 class="h3 mb-3">Active</h2>
                <div id="activeReminders" class="d-grid gap-3"></div>
                </div>

                <div class="col-md-6 ps-md-4 column-divider">
                <h2 class="h3 mb-3">Inactive</h2>
                <div id="inactiveReminders" class="d-grid gap-3"></div>
                </div>
            </div>

            </div>
        </main>
        </div>

        <!-- Delete confirmation modal -->
        <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h2 class="modal-title h4" id="deleteModalTitle">Delete Reminder?</h2>
            </div>
            <div class="modal-body small">
                <span id="deleteReminderName" class="fw-bold"></span>
                <span class="text-danger">cannot be recovered once deleted</span>. Are you sure you want to delete?
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="confirmDeleteBtn" class="btn btn-danger btn-sm px-3">Delete</button>
            </div>
            </div>
        </div>
        </div>

        <!-- Shared color / icon picker modal -->
        <div class="modal fade" id="pickerModal" tabindex="-1" aria-labelledby="pickerModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="pickerModalTitle">Edit Color</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="pickerOptions" class="d-flex flex-wrap gap-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/all_reminders.js"></script>

</body>
</html>
