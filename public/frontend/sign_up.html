<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Dailies - Sign Up</title>

    <!-- Adding Bootstrap -->
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <!-- Adding custom CSS -->
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/auth_pages.css">

</head>
<body>
    
    <!-- this is the sign up page -->

    <!-- its pretty simple design wise -->

    <!-- there will be authentication involved of course -->

    <!-- this is where a user will make their account if they do not have one already -->

    <section id="signUpPage" class="auth-page">

        <main class="auth-wrap">
            <a href="profile_select.html" class="auth-back">
            <i class="bi bi-arrow-left"></i> Profile Select
            </a>

            <div id="signUpContainer" class="auth-card">
            <h1 class="h4 text-center mb-4">Create an Account</h1>

            <form id="signUpForm" class="d-grid gap-3">
                <div>
                <label for="email" class="visually-hidden">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Email"
                        autocomplete="email" required>
                </div>

                <div>
                <label for="username" class="visually-hidden">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Username"
                        autocomplete="username" required>
                </div>

                <div>
                <label for="password" class="visually-hidden">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Password"
                        autocomplete="new-password" required>
                </div>

                <div class="or-divider">Or</div>

                <button type="button" id="googleBtn" class="btn btn-light border-dark fw-bold google-btn">
                <i class="bi bi-google me-1"></i> Sign In With Google
                </button>

                <div class="d-flex justify-content-end">
                <!-- <button type="submit" id="signUpBtn" class="btn btn-info fw-bold px-4">Create Account</button> -->
                <!-- TEMPORARY LINK TO DASHBOARD FOR EASY TESTING -->
                <button type="submit" id="signUpBtn" class="btn btn-info fw-bold px-4">
                    <a href="dashboard.html">Create Account</a></button>
                </div>
            </form>

            <p id="errorMsg" class="text-danger small mt-3 mb-0" role="alert"></p>
            <p id="successMsg" class="text-success small mt-3 mb-0" role="status"></p>

            <p class="auth-switch mt-3 mb-0">
                Already have an account? <a href="sign_in.html" class="link-dark">Sign in</a>
            </p>
            </div>
        </main>

        <!-- deciding if I want to have a footer like this or not -->
        <footer class="auth-footer">&copy;2026 Shark Studios</footer>

        </section>

        <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../assets/js/sign_up.js"></script>

</body>
</html>
