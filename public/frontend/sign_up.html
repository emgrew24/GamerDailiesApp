<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Dailies - Sign Up</title>

    <!-- Adding Bootstrap -->

<body>
    
    <!-- this is the sign up page -->

    <!-- its pretty simple design wise -->

    <!-- there will be authentication involved of course -->

    <!-- this is where a user will make their account if they do not have one already -->

    <section id="signUpPage">

        <main>
            <div id="signUpContainer" style="background-color: lightgreen;">  <!-- temp color -->
                <h1>Create A New Account</h1>
                <hr>
                <form id="signUpForm">
                    <label>Email:</label>
                    <input type="email" id="email" required>
                    <br>

                    <label>Username:</label>
                    <input type="text" id="username" required>
                    <br>
                    
                    
                    <label>Password:</label>
                    <input type="password" id="password" required>
                    <br><br>
                    <button type="submit" id="signUpBtn"><strong> <a href="dashboard.html">Create Account</a> </strong></button>
                    <!-- temp link straight to the dashboard -->
                    <!-- REMOVE WHEN BACKEND WORK IS DONE -->
                </form>

                <p id="errorMsg" style="color:red;"></p>
                <p id="successMsg" style="color:green;"></p>

                <p>Already have an account? <a href="sign_in.html">Sign In Here!</a></p>
            </div>
            
        </main>

        <!-- Not sure if I want a footer like this yet -->
        <footer>
            <h3>&copy;2026 Shark Studios</h3>
        </footer>

    </section>

</body>
