<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Dailies - All Lists</title>

    <!-- Adding Bootstrap -->
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <!-- Adding custom CSS -->
    <link rel="stylesheet" href="../assets/css/all_lists.css">
</head>
<body>
    
    <!-- this is the page where a user can view all of their lists created -->

    <!-- towards the top there will be an option to make a new list or
    manage current lists -->

    <!-- the sidebar will be visible here  -->

    <div class="d-flex vh-100">

        <!-- Sidebar (same as dashboard) -->
        <aside class="sidebar d-flex flex-column p-3">
            <div class="d-flex align-items-center gap-2 pb-3 sidebar-divider">
            <i class="bi bi-person-circle fs-1"></i>
            <span id="profileName" class="small">Dashboard</span>
            </div>

            <nav class="d-grid gap-3 mt-4">
            <a href="all_lists.html" class="btn btn-light border border-dark rounded-pill fw-bold btn-sm" aria-current="page">All Lists</a>
            <a href="all_reminders.html" class="btn btn-light border border-dark rounded-pill fw-bold btn-sm">All Reminders</a>
            </nav>

            <div class="mt-auto d-flex flex-column align-items-center gap-2">
            <a href="settings.html" class="btn btn-secondary btn-sm fw-bold">
                <i class="bi bi-gear-fill"></i> Settings
            </a>
            <a href="profile_select.html" class="btn btn-danger btn-sm">Switch profile</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-grow-1 d-flex flex-column overflow-hidden">
            <div class="flex-grow-1 overflow-auto px-4 pt-3 pb-4">

                <!-- Page Title & Back Link -->
                <h1 class="display-4 mb-0">Your Lists</h1>
                <a href="dashboard.html" class="text-dark text-decoration-none d-inline-flex align-items-center gap-2">
                    <i class="bi bi-arrow-left-circle fs-5"></i> Dashboard
                </a>

                <!-- Action Buttons -->
                <!-- Action buttons (normal + manage mode) -->
                <div class="pb-2 mt-2 page-divider">
                    <div id="normalActions">
                        <div class="d-flex justify-content-end gap-2">
                            <a href="list.html" class="btn btn-info btn-sm fw-bold rounded-pill px-3">+ Add New</a>
                            <button id="manageListsBtn" type="button" class="btn btn-light border border-dark btn-sm fw-bold rounded-pill">
                                <i class="bi bi-gear-fill"></i> Manage Lists
                            </button>
                        </div>
                    </div>

                    <div id="manageActions" class="d-none">
                        <div class="d-flex justify-content-end align-items-center gap-3 small">
                            <span id="selectedCount" class="text-info">0 selected</span>
                            <button id="duplicateSelectedBtn" type="button" class="btn btn-link link-dark p-0 small">Duplicate</button>
                            <button id="deleteSelectedBtn" type="button" class="btn btn-link link-dark p-0 small">Delete</button>
                            <button id="doneBtn" type="button" class="btn btn-outline-info btn-sm fw-bold rounded-pill px-3">Done</button>
                        </div>
                    </div>
                </div>

                <!-- Sort Button -->
                <div class="d-flex justify-content-end mt-2 mb-3">
                    <div class="dropdown">
                        <button class="btn btn-light border border-dark btn-sm fw-bold" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                            Sort <i class="bi bi-filter"></i>
                        </button>
                        <ul id="sortMenu" class="dropdown-menu dropdown-menu-end">
                            <li><button class="dropdown-item" type="button" data-sort="name-asc">Name (A–Z)</button></li>
                            <li><button class="dropdown-item" type="button" data-sort="name-desc">Name (Z–A)</button></li>
                            <li><button class="dropdown-item" type="button" data-sort="newest">Newest first</button></li>
                            <li><button class="dropdown-item" type="button" data-sort="oldest">Oldest first</button></li>
                        </ul>
                    </div>
                </div>

                <!-- Lists Grid -->
                <div id="allLists" class="row row-cols-3 row-cols-xl-4 g-4"></div>

            </div>
        </main>
    </div>

    <!-- Delete Popup -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h2 class="modal-title h4" id="deleteModalTitle">Delete Lists?</h2>
                </div>
                <div class="modal-body small">
                    The selected lists <span class="text-danger">cannot be recovered once deleted</span>.
                    Are you sure you want to delete?
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="confirmDeleteBtn" class="btn btn-danger btn-sm px-3">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/all_lists.js"></script>

</body>
</html>
